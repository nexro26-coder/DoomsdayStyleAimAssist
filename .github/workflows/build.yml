name: Build AimAssist

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Extract source
        run: unzip -q DoomsdayStyleAimAssist-mouse-override-source.zip -d unpack

      - name: Build mod
        run: cd unpack/DoomsdayStyleAimAssist && gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: doomsday-style-aimassist
          path: unpack/DoomsdayStyleAimAssist/build/libs/*.jar
